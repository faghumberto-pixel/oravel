name = "oravel-cadastro-mail"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[vars]
FIREBASE_PROJECT = "oravel-org"
ALLOWED_ORIGINS = "https://oravel.org,https://www.oravel.org,https://oravel-org.web.app"
SMTP_HOST = "smtp.titan.email"
SMTP_PORT = "465"
MAIL_TO = "contato@oravel.org"
# Segredos (não ficam no repositório):
#   npx wrangler secret put SMTP_USER   -> contato@oravel.org
#   npx wrangler secret put SMTP_PASS   -> senha da caixa no Titan
