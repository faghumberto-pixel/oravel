name = "oravel-cadastro-mail"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[vars]
FIREBASE_PROJECT = "oravel-org"
ALLOWED_ORIGINS = "https://oravel.org,https://www.oravel.org,https://oravel-org.web.app"
MAIL_TO = "contato@oravel.org"
MAIL_FROM = "oravel.org <cadastro@oravel.org>"
# Segredo (não fica no repositório):
#   npx wrangler secret put RESEND_API_KEY   -> chave da API do Resend

[observability]
enabled = true
