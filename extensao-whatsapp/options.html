<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Oravel CRM — opções</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #0f172a; }
  label { display: grid; gap: 4px; font-weight: 600; margin-top: 16px; } input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
  button { margin-top: 16px; margin-right: 8px; padding: 9px 14px; border-radius: 8px; border: 0; background: #0f172a; color: #fff; font-weight: 700; cursor: pointer; }
  #status { margin-top: 16px; padding: 10px; border-radius: 8px; display: none; } .ok { background: #f0fdf4; color: #166534; } .erro { background: #fef2f2; color: #991b1b; }
  small { color: #5b6472; font-weight: 400; }
</style></head>
<body>
  <h1>Oravel CRM para WhatsApp Web</h1>
  <p>Gere o token no sistema em <b>Comercial → Gestão CRM → Integração / API</b> e cole abaixo.</p>
  <label>Endereço do sistema <small>(padrão https://app.oravel.com.br)</small><input id="base" placeholder="https://app.oravel.com.br"></label>
  <label>Token <small>(guardado só neste navegador)</small><input id="token" type="password" autocomplete="off"></label>
  <button id="salvar">Salvar e testar</button><button id="limpar" style="background:#fff;color:#0f172a;border:1px solid #cbd5e1">Remover token</button>
  <div id="status"></div>
  <script src="lib/api.js"></script>
  <script src="options.js"></script>
</body></html>
