# Checklists -- PLATAFORMA ELEVATORIA (tesoura/articulada). TEMPLATE INICIAL, tudo editavel pelo tenant (a fonte da verdade e o banco).
# REVISAR COM O RESPONSAVEL TECNICO ANTES DE USO EM PRODUCAO. As normas citadas sao hipoteses de referencia e nao afirmam
# conformidade legal automatica.
versao: 1

template:
  slug: plataforma-pre-uso
  grupo: plataforma-elevatoria
  nome: "Checklist de pré-uso da plataforma elevatória"
  tipo: pre_uso
  periodicidade: por_uso
  referencia_manual: "NR-18, NR-35 e NR-12 (hipótese, validar); manual do fabricante"
  observacoes: "Faça no chão, antes de subir. Qualquer item crítico não conforme: a plataforma não sobe."

secoes:
  - slug: base-deslocamento
    titulo: "Base e deslocamento"
    itens:
      - {slug: pneus-esteiras, descricao: "Pneus ou esteiras sem corte, bolha ou desgaste excessivo", requisito: pneus}
      - {slug: estabilizadores-sapatas, descricao: "Estabilizadores e sapatas íntegros e apoiando firme no piso", critico: true, requisito: estabilizadores-nivelamento, referencia: "Manual do fabricante"}
      - {slug: piso-terreno, descricao: "Piso firme, nivelado e sem buraco, rampa ou fio energizado no raio de trabalho", critico: true, referencia: "NR-18 (validar)"}
      - {slug: bateria-combustivel, descricao: "Bateria carregada ou combustível suficiente", requisito: bateria-combustivel}
  - slug: hidraulica
    titulo: "Hidráulica"
    itens:
      - {slug: nivel-hidraulico, descricao: "Nível do óleo hidráulico dentro da marca"}
      - {slug: vazamentos, descricao: "Sem vazamento em mangueiras, cilindros e conexões", critico: true, requisito: vazamentos}
  - slug: comandos-seguranca
    titulo: "Comandos e dispositivos de segurança"
    itens:
      - {slug: comandos-inferior, descricao: "Comandos do painel inferior respondem em todos os movimentos"}
      - {slug: comandos-superior, descricao: "Comandos do cesto respondem em todos os movimentos"}
      - {slug: parada-emergencia, descricao: "Parada de emergência do chão e do cesto testadas", critico: true, referencia: "NR-12 (validar)"}
      - {slug: descida-emergencia, descricao: "Descida de emergência testada e funcionando", critico: true, requisito: comandos-emergencia-descida}
      - {slug: alarmes, descricao: "Alarme sonoro e luz de sinalização funcionando"}
      - {slug: sensor-inclinacao, descricao: "Sensor de inclinação funcionando (alarme ao inclinar)", critico: true, requisito: sensor-inclinacao}
  - slug: cesto-trabalho-altura
    titulo: "Cesto e trabalho em altura"
    itens:
      - {slug: guarda-corpo-portao, descricao: "Guarda-corpo completo e portão do cesto travando", critico: true, requisito: guarda-corpos, referencia: "NR-18 (validar)"}
      - {slug: inspecao-cesto, descricao: "Piso e estrutura do cesto sem trinca, deformação ou solda aberta"}
      - {slug: ancoragem-cinto, descricao: "Ponto de ancoragem íntegro e cinto de segurança com talabarte disponível", critico: true, referencia: "NR-35 (validar)"}
      - {slug: plaqueta-carga, descricao: "Plaqueta de capacidade de carga legível e carga prevista dentro do limite", critico: true}
  - slug: operacao-documentos
    titulo: "Operação e documentos"
    itens:
      - {slug: capacitacao-operador, descricao: "Operador com capacitação válida para esta plataforma", critico: true, referencia: "NR-35 e NR-18 (validar)"}
      - {slug: isolamento-area, descricao: "Área de trabalho isolada e sinalizada no nível do chão"}
      - {slug: horimetro, descricao: "Horímetro atual", tipo_resposta: numerico, unidade: h}
