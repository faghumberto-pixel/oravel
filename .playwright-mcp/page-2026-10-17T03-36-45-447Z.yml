  - generic [ref=f16e16]:
    - text: Nossa história
    - heading "A tecnologia que nasceu da cicatriz, não da planilha" [level=1] [ref=f16e17]
    - paragraph [ref=f16e18]: "Software feito por quem já esteve do outro lado do balcão: na locação, na manutenção e no campo."
  - main [ref=f16e19]:
    - article [ref=f16e20]:
      - paragraph [ref=f16e21]: Existe um abismo entre o software criado em um escritório ar-condicionado e a solução forjada no calor da operação. Enquanto a maioria das empresas de tecnologia "desenha" sistemas, nós vivenciamos cada obstáculo da locação de máquinas.
      - paragraph [ref=f16e22]: A Oravel não nasceu de uma reunião de diretoria; ela nasceu do silêncio angustiante de uma máquina parada no canteiro de obras, da urgência de um cliente que precisa de solução "para ontem" e da complexidade de gerenciar frotas que não param. Nós sabemos o peso de cada contrato, a incerteza de uma manutenção não planejada e a pressão de fazer o horímetro bater a meta.
      - blockquote [ref=f16e23]:
        - text: Transformar essa vivência em um sistema não foi uma escolha de mercado; foi uma
        - strong [ref=f16e24]: estratégia de sobrevivência
        - text: .
      - paragraph [ref=f16e25]: "Sabemos que, no seu negócio, o erro de margem é zero. Por isso, a Oravel não é apenas uma ferramenta de gestão: é a transposição da nossa experiência para a sua tela. Cada linha de código do nosso sistema é uma resposta para uma dor que nós mesmos já sentimos. Quando você clica em um botão na Oravel, não está apenas executando um comando: você está utilizando a inteligência acumulada de quem entende que a tecnologia precisa ter \"cancha\" de balcão."
      - paragraph [ref=f16e26]: Nós eliminamos o achismo porque o mercado não perdoa o amadorismo. Substituímos a improvisação por previsibilidade, transformando a complexidade do dia a dia em uma operação fluida, onde o controle absoluto não é um luxo, é a sua base de sustentação.
      - paragraph [ref=f16e27]: Não somos apenas fornecedores de software. Somos parceiros de trincheira. De quem já esteve do seu lado do balcão, para quem entende que a tecnologia é a única diferença entre apenas "operar" e "dominar" o mercado.
      - paragraph [ref=f16e28]: "Oravel: a tecnologia que fala a sua língua, porque conhece as suas batalhas."
    - generic [ref=f16e29]:
      - generic [ref=f16e30]:
        - heading "Feito na operação" [level=3] [ref=f16e31]
        - paragraph [ref=f16e32]: Cada tela nasceu de um problema real de pátio, obra e contrato.
      - generic [ref=f16e33]:
        - heading "Previsibilidade" [level=3] [ref=f16e34]
        - paragraph [ref=f16e35]: "Menos achismo: manutenção, estoque, frota e financeiro com dados na mão."
      - generic [ref=f16e36]:
        - heading "Parceria" [level=3] [ref=f16e37]
        - paragraph [ref=f16e38]: Treinamento, suporte e uma equipe que entende o seu dia a dia.
