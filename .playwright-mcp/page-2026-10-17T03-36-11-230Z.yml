      - heading "Nós entendemos a sua operação, seja qual for o segmento" [level=2] [ref=f11e322]
      - paragraph [ref=f11e323]: Oravel não é apenas software. Nasceu da vivência de quem operou locadora, frota e estoque e conhece os desafios de quem vive de equipamentos, equipes e serviços em campo — seja uma locadora, uma prestadora de manutenção industrial, uma montadora, uma operação de logística ou uma empresa de serviços.
      - paragraph [ref=f11e324]: "Cada segmento tem as suas dores, e a Oravel responde a cada uma com telas e módulos pensados para ela: contratos e medições na locação, ordens de serviço e preventivas na manutenção, frentes de serviço e horas na montagem, agenda de motoristas e transportes na logística, portal do cliente e custo por serviço na gestão de serviços."
