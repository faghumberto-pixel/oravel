    - generic [ref=f12e195]:
      - generic [ref=f12e196]: Manifesto
      - heading "Every operation deserves to run with clarity." [level=2] [ref=f12e197]
      - generic [ref=f12e198]: We believe every equipment operation can run with clarity, predictability and peace of mind.
      - paragraph [ref=f12e199]: We saw this from the inside. We ran an equipment operation for years. We know the silence of a machine idle on the job site, the part missing at the wrong time, the customer waiting "since yesterday" and the month-end close that would not add up.
      - paragraph [ref=f12e200]: "And we learned one thing: organized operations do not depend on luck or heroes. They depend on having the right information, at the right time, in the hands of whoever decides."
      - paragraph [ref=f12e201]: "That is why we believe that:"
      - list [ref=f12e202]:
        - listitem [ref=f12e203]: Whoever builds an operation deserves to see all of it, in numbers, and grow with confidence.
        - listitem [ref=f12e204]: Control is not bureaucracy. It is what lets you decide without guessing.
        - listitem [ref=f12e205]: A good system does not complicate things. It starts with what is a priority and grows with your operation.
        - listitem [ref=f12e206]: "Technology is only worth it if it shows results: more equipment available, planned purchases, a clear cost for each piece of equipment."
        - listitem [ref=f12e207]: Decision makers need a conversation in their own language. The language of decision makers is results, not features.
      - paragraph [ref=f12e208]: We put the experience of people who have been on your side of the counter into simple modules, connected from the field to the office.
      - generic [ref=f12e209]: Our promise. You do not have to take our word for it. Use it for 30 days, with us by your side, and measure. If it does not make sense, you owe nothing.
      - generic [ref=f12e210]: Oravel. Control from people who have been on your side of the counter.
