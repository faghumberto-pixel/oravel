    - generic [ref=f12e105]:
      - generic [ref=f12e106]: Why Oravel exists
      - heading "We have been on your side of the counter." [level=2] [ref=f12e107]
      - paragraph [ref=f12e108]: We ran an equipment operation for years. We lived the machine idle on the job site, the part missing at the wrong time, the customer waiting "since yesterday" and the month-end close that would not add up.
      - paragraph [ref=f12e109]: "We learned that none of this is bad luck. It is a lack of information at the right time. That is why we created Oravel: so every equipment operation runs with clarity, predictability and peace of mind, from the field to the office."
      - link "Read the full manifesto →" [ref=f12e110] [cursor=pointer]:
        - /url: "#manifesto"
    - generic [ref=f12e112]:
      - generic [ref=f12e113]: What changes
      - heading "A predictable operation starts with the right information at the right time." [level=2] [ref=f12e114]
      - paragraph [ref=f12e115]: Anyone who has run an equipment operation knows the value of having control in hand. These are the four changes Oravel brings to your day to day.
      - generic [ref=f12e116]:
        - generic [ref=f12e117]:
          - generic [ref=f12e118]: Predictability
          - heading "Equipment ready when the customer needs it" [level=3] [ref=f12e119]
          - paragraph [ref=f12e120]: Maintenance planned on time and at the right hour-meter reading, so equipment is available and the team works without surprises.
          - generic [ref=f12e121]: "In Oravel: the work order is opened automatically by hour meter or due date, with a checklist and an assigned technician."
        - generic [ref=f12e122]:
          - generic [ref=f12e123]: Availability
          - heading "The right part, at the right time" [level=3] [ref=f12e124]
          - paragraph [ref=f12e125]: With the real balance in sight, purchases are planned and maintenance does not wait for parts.
          - generic [ref=f12e126]: "In Oravel: the part used on a work order leaves inventory on the spot, and you see the real balance and what is running out."
        - generic [ref=f12e127]:
          - generic [ref=f12e128]: Trust
          - heading "Delivery and return with transparency" [level=3] [ref=f12e129]
          - paragraph [ref=f12e130]: "Everything recorded on the way out and back: a clear and fair relationship with the customer, with no arguments."
          - generic [ref=f12e131]: "In Oravel: checkout and return with a checklist, before and after photos and digital signature."
        - generic [ref=f12e132]:
          - generic [ref=f12e133]: View of the real cost
          - heading "Every piece of equipment with its own history" [level=3] [ref=f12e134]
          - paragraph [ref=f12e135]: You know how much each machine earns and how much it costs, and decide with confidence what to keep, renew or sell.
          - generic [ref=f12e136]: "In Oravel: each piece of equipment has its own file: maintenance history, parts and accumulated cost."
      - generic [ref=f12e137]: "Also on the platform: vehicle and driver logistics, accounts payable and receivable with bank slips, a customer portal and integrated WhatsApp communication."
    - generic [ref=f12e139]:
      - generic [ref=f12e140]:
