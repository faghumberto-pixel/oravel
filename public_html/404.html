<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página Não Encontrada - Oravel</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@400;500;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --color-bg: #0a0e27;
            --color-bg-secondary: #111530;
            --color-accent: #0066ff;
            --color-accent-light: #3399ff;
            --color-text-primary: #ffffff;
            --color-text-secondary: #b0b3c1;
            --color-text-muted: #7a7d8c;
            --color-border: rgba(0, 102, 255, 0.15);
            --color-border-hover: rgba(0, 102, 255, 0.4);
            --color-error: #ff6b6b;
        }

        html { scroll-behavior: smooth; }

        body {
            background: linear-gradient(135deg, var(--color-bg) 0%, #1a1f3a 100%);
            color: var(--color-text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -10%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0, 102, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 25s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(40px); }
        }

        .error-container {
            position: relative;
            z-index: 2;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            background: linear-gradient(135deg, var(--color-text-primary) 0%, var(--color-accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .error-code {
            font-family: 'Syne', sans-serif;
            font-size: clamp(120px, 30vw, 200px);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--color-error) 0%, #ff4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            opacity: 0.9;
        }

        .error-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(28px, 6vw, 40px);
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .error-message {
            font-size: 16px;
            color: var(--color-text-secondary);
            line-height: 1.7;
            margin-bottom: 40px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%);
            color: #000;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 16px 36px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 102, 255, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 102, 255, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .support-text {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--color-border);
            font-size: 13px;
            color: var(--color-text-muted);
            line-height: 1.6;
        }

        .support-text a {
            color: var(--color-accent-light);
            text-decoration: none;
            font-weight: 500;
        }

        .support-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .error-code { font-size: 90px; }
            .error-title { font-size: 24px; }
            .error-message { font-size: 15px; }
            .btn { padding: 14px 28px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="logo">Oravel</div>

        <div class="error-code">404</div>

        <h1 class="error-title">Página Não Encontrada</h1>

        <p class="error-message">
            O endereço que você tentou acessar não existe ou foi movido.
        </p>

        <a href="/" class="btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Voltar para a Página Principal
        </a>

        <p class="support-text">
            Acha que isso é um erro?
            <a href="mailto:suporte@oravel.com.br">Entre em contato com o suporte</a>
        </p>
    </div>
</body>
</html>
